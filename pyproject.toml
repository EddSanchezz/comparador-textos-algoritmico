[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comparador-textos-algoritmico"
version = "0.1.0"
description = "Comparación de abstracts científicos mediante algoritmos de similitud."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "rq_1*", "rq_2*", "rq_3*"]
